name: ezeewashadminapp
description: "EzeeWash Mobile Admin Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.2
  onesignal_flutter: ^5.3.4
  google_fonts: ^8.2.1
  syncfusion_flutter_charts: ^34.2.5
  pdf: ^3.12.0
  printing: ^5.14.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/logo.png"
  remove_alpha_ios: true